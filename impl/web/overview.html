<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cube-agent · 系统断面</title>
<link rel="stylesheet" href="/overview.css" />
</head>
<body>
<div class="frame">
  <div class="sheet">
    <header class="sheet-head">
      <div>
        <h1>系统断面</h1>
        <div class="sub mono" id="sheet-sub">cube-agent · 分层断面 A–A</div>
      </div>
      <div class="marks">
        <div class="stamp" id="stamp" hidden>模型未接入</div>
        <button class="hand" id="refresh" type="button">重画</button>
      </div>
    </header>

    <div class="body">
      <section class="plate plate-stack">
        <div class="plate-head">
          <span class="mono">断面 A–A · 运行栈</span>
          <span class="mono dim" id="stack-meta">-</span>
        </div>
        <div class="stack" id="layers"></div>
      </section>

      <section class="plate plate-pending">
        <div class="plate-head">
          <span class="mono">待审批</span>
          <span class="mono dim" id="pending-count">-</span>
        </div>
        <div class="pending" id="pending"></div>
      </section>

      <section class="plate plate-gaps">
        <div class="plate-head">
          <span class="mono">缺口标注 · 文档有 / 代码无</span>
          <span class="mono dim" id="gaps-meta">-</span>
        </div>
        <div class="gaps">
          <div class="hatch" id="gap-box"></div>
          <div class="annot">
            <p class="red" id="gap-note">依据 CONFORMANCE.md 对账结果</p>
            <p class="dim" id="gap-hint">斜线区 = 设计里写了、实现里没有</p>
          </div>
        </div>
      </section>

      <section class="plate plate-ledger">
        <div class="plate-head">
          <span class="mono">活动记录</span>
          <span class="mono dim" id="audit-count">-</span>
        </div>
        <ol class="ledger" id="audit"></ol>
      </section>
    </div>

    <footer class="titleblock">
      <div class="cell"><span class="k mono">图号</span><span class="v mono">CA-OV-01</span></div>
      <div class="cell"><span class="k mono">版本</span><span class="v mono" id="tb-build">-</span></div>
      <div class="cell"><span class="k mono">租户</span><span class="v mono" id="tb-tenant">-</span></div>
      <div class="cell"><span class="k mono">日期</span><span class="v mono" id="tb-date">-</span></div>
      <div class="cell"><span class="k mono">比例</span><span class="v mono">1:1</span></div>
      <div class="cell"><span class="k mono">张数</span><span class="v mono">1 / 1</span></div>
    </footer>
  </div>
</div>
<script src="/overview.js"></script>
</body>
</html>
