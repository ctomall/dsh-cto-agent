<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cube-agent · 总览</title>
<link rel="stylesheet" href="/overview.css" />
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="brand">cube<span>·agent</span></div>
    <div class="rail-group">
      <div class="rail-label">工作区</div>
      <a class="rail-item" id="to-workbench" href="/">工作台</a>
      <a class="rail-item active" href="/overview">总览</a>
    </div>
    <div class="rail-foot">
      <span id="build">-</span>
      <span id="tenant">-</span>
    </div>
  </nav>

  <main class="main">
    <header class="page-head">
      <div>
        <h1>总览</h1>
        <p class="sub" id="sub">—</p>
      </div>
      <div class="head-actions">
        <span class="pill" id="driver"><i class="dot"></i><span>模型 -</span></span>
        <button class="btn" id="refresh" type="button">刷新</button>
      </div>
    </header>

    <div class="grid">
      <section class="card card-layers">
        <div class="card-head">
          <h2>分层</h2>
          <span class="meta" id="layers-meta">L0–L5</span>
        </div>
        <div class="rows" id="layers"></div>
      </section>

      <section class="card card-gaps">
        <div class="card-head">
          <h2>文档有 · 代码无</h2>
          <span class="meta" id="gaps-meta">4 处</span>
        </div>
        <div class="rows" id="gaps"></div>
        <p class="foot-note">依据 CONFORMANCE.md 对账结果</p>
      </section>

      <section class="card card-activity">
        <div class="card-head">
          <h2>活动记录</h2>
          <span class="meta" id="audit-count">0 条</span>
        </div>
        <div class="rows" id="audit"></div>
      </section>
    </div>
  </main>

  <aside class="side">
    <section class="side-block">
      <div class="side-head">
        <h2>待审批</h2>
        <span class="meta" id="pending-count">0 条</span>
      </div>
      <div class="side-rows" id="pending"></div>
    </section>
    <section class="side-block">
      <div class="side-head"><h2>本租户</h2></div>
      <dl class="kv" id="tenant-kv"></dl>
    </section>
  </aside>
</div>
<script src="/overview.js"></script>
</body>
</html>
