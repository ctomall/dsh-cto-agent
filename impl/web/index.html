<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cube-agent</title>
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<div class="app">
  <nav class="nav">
    <div class="brand">cube<span>·agent</span></div>
    <div class="nav-group">
      <div class="nav-label">会话</div>
      <ul id="sessions" class="sessions"></ul>
    </div>
    <div class="nav-foot">
      <span id="ver" class="mono">build -</span>
      <span id="who" class="mono">-</span>
    </div>
  </nav>

  <main class="main">
    <header class="topbar">
      <h1 id="title">新会话</h1>
      <div class="run" id="runbar" hidden>
        <span class="dot" id="rundot"></span>
        <span id="runlabel">正在执行</span>
        <button class="ghost" id="stop">停止</button>
      </div>
    </header>

    <section id="stream" class="stream">
      <div class="empty" id="empty">
        <h2>把目标交给它，它自己选工具</h2>
        <p>危险动作执行前会停下来等你确认，产物落进会话工作区。</p>
        <div class="examples">
          <button class="chip" data-fill="把这三个 PDF 汇总成一份带目录的 docx">把三个 PDF 汇总成 docx</button>
          <button class="chip" data-fill="查一下这个库的构建失败原因">查构建失败原因</button>
          <button class="chip" data-fill="把这段结论写进知识库">写进知识库</button>
        </div>
      </div>
    </section>

    <form class="composer" id="composer">
      <div class="composer-row">
        <textarea id="input" rows="1" placeholder="描述你要完成的事"></textarea>
        <button type="submit" id="send">发送</button>
      </div>
      <div class="composer-hint">
        <span><kbd>Enter</kbd> 发送</span>
        <span><kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</span>
        <span><kbd>Esc</kbd> 停止</span>
      </div>
    </form>
  </main>

  <aside class="side">
    <section class="side-block">
      <div class="side-label">产物</div>
      <div id="artifacts" class="artifacts"><p class="muted">还没有产物</p></div>
    </section>
    <section class="side-block">
      <div class="side-label">本会话授权</div>
      <p class="muted" id="grants">尚未授权任何工具</p>
      <button class="btn quiet" id="revoke">撤销本会话授权</button>
    </section>
  </aside>
</div>
<script src="/app.js"></script>
</body>
</html>
